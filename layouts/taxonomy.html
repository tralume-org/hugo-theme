{{ define "main" }}
  {{/* 说明：Tags/分类概览页与其它列表页保持一致：顶部简介卡片 + 词条卡片网格。 */}}
  <section class="page-intro-card page-intro-card--section app-glass app-card">
    {{/* 说明：/tags 概览页使用 i18n 标题，其它 taxonomy 保持 .Title。 */}}
    <h1 class="page-intro-card__title">{{ partial "page-title-i18n.html" . }}</h1>
    {{ with .Content }}
      <div class="page-intro-card__body">
        {{ . }}
      </div>
    {{ end }}
  </section>
  {{ partial "taxonomy-term-list.html" (dict "Terms" .Pages "Context" .) }}
{{ end }}
