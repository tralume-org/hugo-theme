{{- /*
  说明：评论区通用卡片外壳。
  用途：让不同 provider 复用同一套亚克力表面、标题与加载占位结构。
  注意：provider 模板只负责注入对应评论容器和初始化脚本。
*/ -}}
{{- $provider := .Provider -}}
{{- $embedID := .EmbedID -}}
<section class="article__comments article__surface app-glass app-glass--surface app-card" data-article-comments data-comments-provider="{{ $provider }}" aria-label="{{ i18n "articleCommentsAriaLabel" }}">
  <div class="article-comments-card">
    <p class="article-comments-card__heading">{{ i18n "articleCommentsHeading" }}</p>
    <div id="{{ $embedID }}" class="article-comments-card__embed" data-loading-label="{{ i18n "articleCommentsLoading" }}"></div>
  </div>
</section>
