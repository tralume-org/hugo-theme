{{/* 说明：语言切换区，通过下拉选单列出全部语言并处理跳转逻辑。 */}}
{{ $currentSite := .Site }}
{{ $translations := .AllTranslations }}
{{ $scratch := newScratch }}
<section class="settings-panel__section">
  <h3 class="settings-panel__section-title">
    <span class="settings-panel__section-icon material-symbols-rounded" aria-hidden="true">translate</span>
    <span class="settings-panel__section-title-text">{{ i18n "settingsPanelLanguageHeading" }}</span>
  </h3>
  <div class="settings-panel__select">
    <select class="settings-panel__language-select" data-language-select aria-label="{{ i18n "settingsPanelLanguageHeading" }}">
      {{ range site.Sites }}
        {{ $isActive := eq .Language.Lang $currentSite.Language.Lang }}
        {{ $translationCandidates := where $translations "Language.Lang" .Language.Lang }}
        {{ $scratch.Set "targetHref" $.RelPermalink }}
        {{ if not $isActive }}
          {{ if gt (len $translationCandidates) 0 }}
            {{ $scratch.Set "targetHref" ((index $translationCandidates 0).RelPermalink) }}
          {{ else }}
            {{ $scratch.Set "targetHref" .Home.RelPermalink }}
          {{ end }}
        {{ end }}
        {{ $href := $scratch.Get "targetHref" }}
        <option
          value="{{ $href }}"
          lang="{{ .Language.Lang }}"
          {{ if $isActive }}selected{{ end }}
        >
          {{ printf "%s (%s)" .Language.LanguageName .Language.Lang }}
        </option>
      {{ end }}
    </select>
  </div>
</section>
