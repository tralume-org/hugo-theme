{{/* 说明：设置面板头部（标题 + 关闭按钮）。 */}}
<div class="settings-panel__header">
  <h2 class="settings-panel__title" id="settings-panel-title">{{ i18n "settingsPanelTitle" }}</h2>
  <button
    class="settings-panel__close app-glass app-glass--surface"
    type="button"
    aria-label="{{ i18n "settingsPanelCloseLabel" }}"
    data-settings-close
  >
    {{ i18n "settingsPanelCloseText" }}
  </button>
</div>
