{{/* 无障碍跳转链接：便于键盘用户快速进入主要内容 */}}
<a class="skip-link" href="#main-content">{{ i18n "skipToContent" }}</a>
<header class="app-header">
  <div class="app-bar">
    <a class="app-title" href="{{ "/" | relLangURL }}">{{ site.Title }}</a>
    {{ partial "menu.html" (dict "menu" site.Menus.main "page" .) }}
  </div>
</header>
{{/* 说明：Pages 下拉面板需渲染在 header 之外，避免 backdrop-filter 的 backdrop root 限制导致“无模糊”。 */}}
{{ partial "pages-menu-panel.html" . }}
