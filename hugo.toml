baseURL = 'https://tralume.org/'
defaultContentLanguage = 'en-US'
defaultContentLanguageInSubdir = true

[languages]
  [languages."en-US"]
    label = 'English'
    locale = 'en-US'
    weight = 1
    title = 'Tralume'

  [languages."zh-Hans"]
    label = '简体中文'
    locale = 'zh-Hans'
    weight = 2
    title = 'Tralume 主题'

  [languages.ja]
    label = '日本語'
    locale = 'ja'
    weight = 3
    title = 'Tralume テーマ'

  [languages.fr]
    label = 'Français'
    locale = 'fr'
    weight = 4
    title = 'Thème Tralume'

  [languages."zh-Hant"]
    label = '繁體中文'
    locale = 'zh-Hant'
    weight = 5
    title = 'Tralume 主題'

[menu]
  [[menu.main]]
    identifier = 'home'
    name = 'Home'
    pageRef = 'home'
    weight = 10
  [[menu.main]]
    identifier = 'posts'
    name = 'Posts'
    pageRef = 'posts'
    weight = 20
  [[menu.main]]
    identifier = 'tags'
    name = 'Tags'
    pageRef = 'tags'
    weight = 30
  [[menu.main]]
    identifier = 'pages'
    name = 'Pages'
    pageRef = 'pages'
    weight = 35
  [[menu.main]]
    identifier = 'friends'
    name = 'Friends'
    pageRef = 'friends'
    weight = 40

# Note: Import the theme via Hugo Modules; if using a submodule, switch to theme = 'tralume'.
[module]
  [module.hugoVersion]
    min = '0.161.1'
    extended = false

[markup]
  [markup.highlight]
    lineNos = false
    noClasses = false

[params.search]
  enable = true
  provider = 'pagefind'