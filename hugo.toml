baseURL = 'https://tralume.org/'
defaultContentLanguage = 'en-US'
defaultContentLanguageInSubdir = true

[outputs]
  home = ['HTML', 'RSS']
  section = ['HTML', 'RSS']
  taxonomy = ['HTML', 'RSS']
  term = ['HTML', 'RSS']

# Note: Multilingual basics; keep menu structure under [menu] and handle text via i18n files.
[languages]
  [languages."en-US"]
    languageName = 'English'
    languageCode = 'en-US'
    weight = 1
    title = 'Tralume'

  [languages."zh-Hans"]
    languageName = '简体中文'
    languageCode = 'zh-Hans'
    weight = 2
    title = 'Tralume 主题'

[menu]
  [[menu.main]]
    identifier = 'home'
    name = 'Home'
    pageRef = '/'
    weight = 10
  [[menu.main]]
    identifier = 'posts'
    name = 'Posts'
    pageRef = '/posts'
    weight = 20
  [[menu.main]]
    identifier = 'tags'
    name = 'Tags'
    pageRef = '/tags'
    weight = 30
  [[menu.main]]
    identifier = 'friends'
    name = 'Friends'
    pageRef = '/friends'
    weight = 40

# Note: Import the theme via Hugo Modules; if using a submodule, switch to theme = 'tralume'.
[module]
  [module.hugoVersion]
    min = '0.146.0'
    extended = false

[params]
  [params.theme]
    # Note: Theme mode options.
    defaultMode = 'auto'