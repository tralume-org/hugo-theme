baseURL = 'https://hugo.tralume.org/'
defaultContentLanguage = 'en-US'
defaultContentLanguageInSubdir = true

# 输出配置：确保每种语言的主页与列表页同时生成 HTML 与 RSS 输出。
[outputs]
  home = ['HTML', 'RSS']
  section = ['HTML', 'RSS']
  taxonomy = ['HTML', 'RSS']
  term = ['HTML', 'RSS']

[languages]
  [languages."en-US"]
    languageName = 'English'
    weight = 1
    title = 'Tralume'
    languageCode = 'en-US'

  [languages."zh-Hans"]
    languageName = '简体中文'
    weight = 2
    title = 'Tralume 主题'
    languageCode = 'zh-Hans'

[menu]
  [[menu.main]]
    identifier = 'home'
    name = 'Home'
    pageRef = '/'
    weight = 10

  [[menu.main]]
    identifier = 'posts'
    name = 'Posts'
    pageRef = '/posts'
    weight = 20

  [[menu.main]]
    identifier = 'tags'
    name = 'Tags'
    pageRef = '/tags'
    weight = 30

  [[menu.main]]
    identifier = 'friends'
    name = 'Friends'
    pageRef = '/friends'
    weight = 40

[module]
  [module.hugoVersion]
    extended = false
    min = '0.146.0'

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false
  style = 'material'

[params.theme]
  # 说明：设定初始主题模式，可选 auto/light/dark。
  defaultMode = 'auto'
