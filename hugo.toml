baseURL = 'https://hugo.tralume.org/'
defaultContentLanguage = 'en-US'
defaultContentLanguageInSubdir = true

# 输出配置：确保每种语言的主页与列表页同时生成 HTML 与 RSS 输出。
[outputs]
  home = ['HTML', 'RSS']
  section = ['HTML', 'RSS']
  taxonomy = ['HTML', 'RSS']
  term = ['HTML', 'RSS']

[languages]
  [languages."en-US"]
    languageName = 'English'
    weight = 1
    title = 'Tralume'
    languageCode = 'en-US'

  [languages."zh-Hans"]
    languageName = '简体中文'
    weight = 2
    title = 'Tralume 主题'
    languageCode = 'zh-Hans'

  [languages."en-US".menus]
    [[languages."en-US".menus.main]]
      identifier = 'home'
      name = 'Home'
      pageRef = '/'
      weight = 10

    [[languages."en-US".menus.main]]
      identifier = 'posts'
      name = 'Posts'
      pageRef = '/posts'
      weight = 20

    [[languages."en-US".menus.main]]
      identifier = 'tags'
      name = 'Tags'
      pageRef = '/tags'
      weight = 30

  [languages."zh-Hans".menus]
    [[languages."zh-Hans".menus.main]]
      identifier = 'home'
      name = '首页'
      pageRef = '/'
      weight = 10

    [[languages."zh-Hans".menus.main]]
      identifier = 'posts'
      name = '文章'
      pageRef = '/posts'
      weight = 20

    [[languages."zh-Hans".menus.main]]
      identifier = 'tags'
      name = '标签'
      pageRef = '/tags'
      weight = 30

[module]
  [module.hugoVersion]
    extended = false
    min = '0.146.0'

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false
  style = 'material'

[params.theme]
  # 说明：设置初始主题色（对应设置面板的预设 ID），避免用户自定义颜色时首屏回退到默认值。
  defaultColor = 'indigo'
  # 说明：设定初始主题模式，可选 auto/light/dark。
  defaultMode = 'auto'
