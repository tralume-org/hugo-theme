- id: umamiBlockedDialogGuideAdguard
  translation: AdGuard

- id: umamiBlockedDialogGuideBrave
  translation: Brave Shields

- id: umamiBlockedDialogFooter
  translation: 无论是否加入白名单，你都可以正常访问和阅读本站的全部内容。
