name: Build and Deploy Docs to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".forgejo/workflows/docs-deploy.yaml"
  workflow_dispatch:

env:
  HUGO_ENVIRONMENT: production
  HUGO_ENV: production

jobs:
  build-deploy:
    runs-on: docker-amd64
    container:
      image: forgejo.alexma.top/alexma233/ci-images-hugo-wrangler:0.164.0

    steps:
      - name: Checkout
        uses: https://forgejo.alexma.top/actions/checkout@v7

      - name: Download Hugo modules
        working-directory: docs
        run: |
          hugo mod tidy
          hugo mod verify

      - name: Build docs
        working-directory: docs
        run: |
          hugo --minify -d public

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: https://forgejo.alexma.top/actions/cloudflare-wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./docs/public --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
