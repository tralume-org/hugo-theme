baseURL: https://tralume.org/
title: Tralume Docs
defaultContentLanguage: en
enableGitInfo: true

languages:
  en:
    label: English
    locale: en
    weight: 1
  zh-hans:
    label: 简体中文
    locale: zh-cn
    weight: 2

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true

module:
  imports:
    - path: github.com/imfing/hextra

outputs:
  home: [html, rss, llms]
  page: [html, markdown]
  section: [html, rss, markdown]

params:
  description: "ralume — a modern acrylic glassmorphism Hugo theme."
  externalLinkDecoration: true
  displayUpdatedDate: true
  dateFormat: "Jan 2, 2006"
  displayUpdatedAuthor: true
  
  theme:
    default: system
    displayToggle: true

  imageZoom:
    enable: true

  navbar:
    displayTitle: true
    displayLogo: false

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward

  analytics:
    umami:
      serverURL: "https://umi.alexma.top"
      websiteID: "bf8787e9-d608-447c-a787-80535c42cb00"

  editURL:
    enable: true
    base: "https://forgejo.alexma.top/tralume-org/hugo-theme/_edit/main/docs/content"

  page:
    contextMenu:
      enable: true
      links:
        - name: Open in ChatGPT
          icon: chatgpt
          url: "https://chatgpt.com/?hints=search&q=I'm looking at this documentation: {url}%0AHelp me understand how to use it."
        - name: Open in Claude
          icon: claude
          url: "https://claude.ai/new?q=I'm looking at this documentation: {url}%0AHelp me understand how to use it."
