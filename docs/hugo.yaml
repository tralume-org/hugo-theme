# 说明：Tralume 文档站 Hugo 配置。
# 说明：使用 Hextra 主题，部署于 docs.tralume.org。
baseURL: https://docs.tralume.org/
title: Tralume Docs
defaultContentLanguage: en
enableGitInfo: true

# 说明：多语言配置。en 为默认语言（无 URL 前缀），zh-hans 使用 /zh-hans/ 前缀。
languages:
  en:
    label: English
    locale: en
    weight: 1
  zh-hans:
    label: 简体中文
    locale: zh-cn
    weight: 2

# 说明：启用 Goldmark 不安全模式，允许在 Markdown 中嵌入原始 HTML。
# 注意：hextra-home 短代码渲染的 HTML 依赖此选项。
markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true

# 说明：通过 Go Modules 导入 Hextra 主题。
module:
  imports:
    - path: github.com/imfing/hextra

outputs:
  home: [html, rss, llms]
  page: [html, markdown]
  section: [html, rss, markdown]

# 说明：为搜索引擎启用站点地图。
sitemap:
  changefreq: weekly
  priority: 0.5

# 说明：Hextra 主题参数。
params:
  description: "Documentation for Tralume — a modern acrylic glassmorphism Hugo theme."

  # 说明：明暗主题切换。
  theme:
    default: system
    displayToggle: true

  # 说明：外部链接显示装饰图标。
  externalLinkDecoration: true
  displayUpdatedDate: true
  dateFormat: "Jan 2, 2006"
  displayUpdatedAuthor: true

  imageZoom:
    enable: true

  # 说明：导航栏配置。
  navbar:
    displayTitle: true
    displayLogo: false

  # 说明：FlexSearch 全文搜索。
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward

  # 说明：Umami 统计分析（隐私友好）。
  analytics:
    umami:
      serverURL: "https://umi.alexma.top"
      websiteID: "bf8787e9-d608-447c-a787-80535c42cb00"

  # 说明：页面底部"编辑此页"链接。
  editURL:
    enable: true
    base: "https://forgejo.alexma.top/tralume-org/hugo-theme/_edit/main/docs/content"

  # 说明：页面右键菜单（快捷跳转 ChatGPT / Claude）。
  page:
    contextMenu:
      enable: true
      links:
        - name: Open in ChatGPT
          icon: chatgpt
          url: "https://chatgpt.com/?hints=search&q=I'm looking at this documentation: {url}%0AHelp me understand how to use it."
        - name: Open in Claude
          icon: claude
          url: "https://claude.ai/new?q=I'm looking at this documentation: {url}%0AHelp me understand how to use it."
